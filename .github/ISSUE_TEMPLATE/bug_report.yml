name: Bug report
description: Something does not work the way the documentation says it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The exact command or code. Paste output as text, not as a screenshot.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `aflab --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: Python 3.12, Windows 11
    validations:
      required: true
  - type: checkboxes
    id: live
    attributes:
      label: Live mode
      options:
        - label: This involves `--live` and a real model. I have left out my API key.
